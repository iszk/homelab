services:

  test-postgres:
    container_name: test-postgres
    restart: unless-stopped
    image: postgres:18
    volumes:
      - pg-data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-testdb}
      - POSTGRES_DB=${POSTGRES_DB:-testdb}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-testdb}
    networks:
      - default
      - test-db

  test-firebase:
    container_name: test-firebase
    restart: unless-stopped

    build:
      context: ./firebase
      dockerfile: Dockerfile
    volumes:
      - ./firebase/.firebaserc:/firebase/.firebaserc
      - ./firebase/firebase.json:/firebase/firebase.json
    tty: true
    working_dir: /firebase
    command: firebase emulators:start
    networks:
      - test-db

volumes:
  pg-data:
    name: test-pg-data
    external: true

networks:
  test-db:
    name: test-db
    external: true
