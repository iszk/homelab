services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: always
    # ports:
    #   - "3001:3001" # This maps the container port "3001" to the host port "3001"
    volumes:
      - kuma-data:/app/data # Configuring persistent storage
    environment:
      - TZ=Asia/Tokyo
      # - UMASK=0022  # Set your file permissions manually
    networks:
      - reverse-proxy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3001" ]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kuma-data:

networks:
  reverse-proxy:
    name: reverse-proxy
    external: true
