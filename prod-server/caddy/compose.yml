name: caddy-prod

services:
  caddy:
    container_name: caddy
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - CADDY_DOCKER_CADDYFILE_PATH=/etc/caddy/Caddyfile
      - CADDY_INGRESS_NETWORKS=reverse-proxy
    volumes:
      - type: bind
        source: ./etc/caddy
        target: /etc/caddy
      - type: bind
        source: /mnt/nas/localnet/caddy/data
        target: /data
      - type: bind
        source: /mnt/nas/localnet/caddy/config
        target: /config
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "80:80"
      - "443:443"
    networks:
      - reverse-proxy

networks:
  reverse-proxy:
    name: reverse-proxy
    external: true

