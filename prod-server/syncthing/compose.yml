---
services:
  syncthing:
    image: syncthing/syncthing
    container_name: syncthing
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Tokyo
    ports:
      # - 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      # - 21027:21027/udp
    volumes:
      # - /mnt/shared/vault:/vault
      - /mnt/shared:/data
    # network_mode: host
    # host が推奨されてるけど直結しかしないなら別に良さそう
    networks:
      - reverse-proxy
    healthcheck:
      test: curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1
      interval: 1m
      timeout: 10s
      retries: 3

networks:
  reverse-proxy:
    name: reverse-proxy
    external: true
